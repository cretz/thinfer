[package]
name = "thinfer-models"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
thinfer-core = { path = "../thinfer-core" }
tracing = { workspace = true }
bytemuck = "1"
# IEEE binary16 (f16) round-trip for the SHADER_F16 acts upload/readback path.
# Same crate already used by thinfer-core's quant decode.
half = { version = "2", features = ["bytemuck"] }
png = "0.17"
# LLM architecture configs are read from the upstream `config.json`.
serde_json = "1"
# LLM chat prompts render through the model's own Jinja chat template.
minijinja = { version = "2", default-features = false, features = ["builtins", "macros", "multi_template", "loop_controls", "adjacent_loop_items", "serde", "json"] }
minijinja-contrib = { version = "2", default-features = false, features = ["pycompat"] }
# LLM job data on the host (embedding rows, logits, sampled history) is wiped on drop.
zeroize = "1"
# `futures::join!` is wasm-compatible and lets thinfer-models stay free of
# tokio. Used to overlap weight prefetch with current-layer GPU submit-await.
futures = { version = "0.3", default-features = false, features = ["async-await", "alloc"] }
