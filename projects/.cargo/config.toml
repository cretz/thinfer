[env]
# fdk-aac (thinfer-app's AAC encoder) has no arch defines for MSVC ARM64 and
# falls through to a `#warning`, which MSVC rejects below C++23. The generic
# branch it then compiles is plain C. Target-scoped, so no other build sees it.
CFLAGS_aarch64_pc_windows_msvc = "/std:c++latest"

[target.wasm32-unknown-unknown]
runner = "wasm-bindgen-test-runner"
# simd128 is universal wherever WebGPU exists; speeds up the CPU-bound wasm
# bits (tokenizer, PNG encode, header parsing).
rustflags = ["-C", "target-feature=+simd128"]
