<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Served same-origin by thinfer-serve, so everything is 'self'. blob: is
         the generated PNG (img) / MP4 (media) object URL. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src blob:; media-src blob:; base-uri 'none'; form-action 'none'"
    />
    <title>thinfer</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <!-- Layout contract (style.css): every control lives in its own `.field`
         block (label + control, or `.check` for a checkbox), so app.js can hide
         any field with the `hidden` attribute without disturbing the layout. A
         `.group` whose fields are all hidden collapses (heading included). -->
    <header class="topbar">
      <h1>thinfer</h1>
      <details id="server">
        <summary>Server</summary>
        <div class="field">
          <label for="token">Auth token</label>
          <input id="token" type="password" placeholder="(none, if the server is open)" />
          <span class="hint" id="token-hint">Stored in this browser only.</span>
        </div>
      </details>
    </header>

    <main class="layout">
      <form id="form" class="card">
        <fieldset id="fields">
          <section class="group">
            <div class="grid">
              <div class="field">
                <label for="kind">Type</label>
                <select id="kind">
                  <option value="image" selected>Image</option>
                  <option value="video">Video</option>
                  <option value="face-swap">Face swap</option>
                </select>
              </div>
              <div class="field">
                <label for="model">Model</label>
                <select id="model"></select>
              </div>
            </div>
          </section>

          <section class="group">
            <div class="field">
              <label for="prompt" id="prompt-label">Prompt</label>
              <textarea id="prompt" rows="6" required>a corgi wearing a tiny wizard hat, studio photo</textarea>
            </div>
          </section>

          <section class="group">
            <h2>Inputs</h2>
            <div class="grid">
              <!-- First-frame / edit image (edit models require it; I2V models
                   do not). -->
              <div class="field span-all" id="input-image-row" hidden>
                <label for="input-image">Input image</label>
                <!-- Pick a file or use the image on the page (shown once one has
                     been generated); either fills the one slot listed below. -->
                <div class="inline">
                  <input id="input-image" type="file" accept="image/png,image/jpeg" />
                  <button id="use-current-image" type="button" class="secondary" hidden>
                    Use current image
                  </button>
                </div>
                <div id="input-image-chosen" class="chosen"></div>
              </div>

              <!-- Ordered reference images: FastH3-Omni (up to 9, the prompt names
                   them <Picture 1>, ...) and Qwen-Image-2.1 (up to 10, image 1,
                   ...), in the order listed. -->
              <div class="field span-all" id="ref-images-row" hidden>
                <label for="ref-images">Reference images</label>
                <div class="inline">
                  <input id="ref-images" type="file" accept="image/png,image/jpeg" multiple />
                  <button id="add-current-ref" type="button" class="secondary" hidden>
                    Use current image
                  </button>
                </div>
                <div id="ref-images-order" class="chosen"></div>
              </div>
              <div class="field span-all" id="ref-image-size-row" hidden>
                <label for="ref-image-size">Reference size</label>
                <select id="ref-image-size">
                  <option value="match" selected>Match the video size (default, fastest)</option>
                  <option value="max">Up to 2048 short edge (never upscaled)</option>
                  <option value="diffusers">2048 short edge (reference, ~2.4x slower)</option>
                </select>
              </div>

              <!-- ltx2-rapid native I2V: frame-0 conditioning strength. -->
              <div class="field" id="strength-row" hidden>
                <label for="strength">Frame-0 strength</label>
                <input id="strength" type="number" min="0" max="1" step="0.05" value="1" />
              </div>

              <!-- Face swap: the source FACE image and the TARGET video. -->
              <div class="field span-all" id="source-image-row" hidden>
                <label for="source-image">Source face</label>
                <input id="source-image" type="file" accept="image/png,image/jpeg" />
              </div>
              <div class="field span-all" id="input-video-row" hidden>
                <label for="input-video">Target video</label>
                <input id="input-video" type="file" accept="video/mp4" />
              </div>
              <div class="field" id="trim-start-row" hidden>
                <label for="trim-start" title="Only swap and output the source starting at this many seconds (rebased to 0). Blank = clip start.">Start (s)</label>
                <input id="trim-start" type="number" min="0" step="0.1" placeholder="(clip start)" />
              </div>
              <div class="field" id="trim-end-row" hidden>
                <label for="trim-end" title="Only swap and output the source up to this many seconds. Blank = clip end.">End (s)</label>
                <input id="trim-end" type="number" min="0" step="0.1" placeholder="(clip end)" />
              </div>
            </div>
          </section>

          <section class="group">
            <h2>Size</h2>
            <div class="grid">
              <div class="field span-all" id="preset-row">
                <label for="preset">Preset</label>
                <select id="preset"></select>
              </div>
              <div class="field" id="width-row">
                <label for="width">Width</label>
                <input id="width" type="number" value="768" min="16" step="16" />
              </div>
              <div class="field" id="height-row">
                <label for="height">Height</label>
                <input id="height" type="number" value="768" min="16" step="16" />
              </div>
              <div class="field video-only" id="duration-row">
                <label for="duration">Duration (s)</label>
                <input id="duration" type="text" inputmode="decimal" placeholder="(seconds)" />
              </div>
              <!-- LTX only: the measured prompt-adherence floor. -->
              <div id="dims-warning" class="warn span-all" hidden></div>
            </div>
          </section>

          <section class="group">
            <h2>Quality and speed</h2>
            <div class="grid">
              <div class="field" id="steps-row">
                <label for="steps">Steps</label>
                <input id="steps" type="number" value="8" min="1" />
              </div>
              <div class="field video-only span-all" id="vae-row">
                <label for="vae">Decoder</label>
                <select id="vae">
                  <option value="tiny" id="vae-opt-tiny" selected>Tiny VAE (fast, default)</option>
                  <option value="tiny-ft" id="vae-opt-tiny-ft" hidden>Tiny VAE, Hunyuan-tuned (fast, better)</option>
                  <option value="full">Full VAE (clean, slower)</option>
                  <option value="nvfp4" id="vae-opt-nvfp4" hidden>NVFP4 decoder (default; RTX 50, else full)</option>
                  <option value="nvfp4-fast" id="vae-opt-nvfp4-fast" hidden>NVFP4 fast decoder (fastest, softer; RTX 50)</option>
                </select>
              </div>
              <div class="field span-all" id="super-res-row" hidden>
                <label for="super-res">Super-res</label>
                <select id="super-res">
                  <option value="" selected>Off (native resolution)</option>
                  <option value="2x">2x RelayVSR (tuned for H3, fast)</option>
                  <option value="4x">4x RelayVSR (slower)</option>
                </select>
              </div>
              <div class="field span-all" id="attn-row" hidden>
                <label for="attn">Attention</label>
                <select id="attn">
                  <option value="int8-fp8" selected>INT8 + FP8 P.V (default, fastest; RTX 40/50, else INT8)</option>
                  <option value="int8">INT8 (bf16 P.V)</option>
                  <option value="bf16">bf16 (reference, different take)</option>
                </select>
              </div>
              <div class="field span-all" id="encoder-row" hidden>
                <label for="encoder">Text encoder</label>
                <select id="encoder">
                  <option value="q8" selected>Q8 (quality, default)</option>
                  <option value="q4">Q4 (fast encode)</option>
                </select>
              </div>
              <div class="field span-all" id="rewrite-quality-row" hidden>
                <label for="rewrite-quality">Prompt rewriter</label>
                <select id="rewrite-quality">
                  <option value="fast" selected>Fast (4B, default)</option>
                  <option value="full">Full (8B, slower)</option>
                </select>
              </div>
              <div class="field" id="guide-scale-row" hidden>
                <label for="guide-scale">Guidance (face)</label>
                <input id="guide-scale" type="number" value="4" min="0" step="0.5" />
              </div>
              <div class="field" id="cfg-every-row" hidden>
                <label for="cfg-every" title="Run the unguided pass every N steps (1 = every step)">Guidance every N steps</label>
                <input id="cfg-every" type="number" value="1" min="1" step="1" />
              </div>
              <div class="field" id="detect-stride-row" hidden>
                <label for="detect-stride" title="Detect faces every Nth frame, reusing the last detection in between. 1 = every frame. Higher is faster but tracks fast head motion less tightly.">Detect every N frames</label>
                <input id="detect-stride" type="number" min="1" step="1" value="1" />
              </div>
              <div class="field" id="bitrate-scale-row" hidden>
                <label for="bitrate-scale" title="Output bitrate as a multiple of the source video's bitrate. 1.15 matches the input's size/quality with a small cushion; higher is larger/cleaner, lower is smaller/softer.">Bitrate x source</label>
                <input id="bitrate-scale" type="number" min="0.1" step="0.05" value="1.15" />
              </div>
              <div class="field">
                <label for="seed">Seed</label>
                <input id="seed" type="text" inputmode="numeric" pattern="[0-9]*" placeholder="(random)" />
              </div>
            </div>

            <!-- Checkbox options: their own wrapping row of toggles. -->
            <div class="checks">
              <div class="check" id="audio-row" hidden>
                <input id="audio" type="checkbox" checked />
                <label for="audio">Audio</label>
              </div>
              <div class="check" id="upscale-row" hidden>
                <input id="upscale" type="checkbox" />
                <label for="upscale">Upscale (hi-res refine)</label>
              </div>
              <div class="check" id="audio-hq-row" hidden>
                <input id="audio-hq" type="checkbox" />
                <label for="audio-hq">HQ audio (finer denoise, slower)</label>
              </div>
              <div class="check" id="rewrite-row" hidden>
                <input id="rewrite" type="checkbox" checked />
                <label for="rewrite">Enhance prompt (recommended)</label>
              </div>
              <div class="check" id="vae-encode-f32-row" hidden>
                <input id="vae-encode-f32" type="checkbox" />
                <label for="vae-encode-f32">Exact reference encode (f32, slower)</label>
              </div>
              <div class="check" id="bf16-gemm-row" hidden>
                <input id="bf16-gemm" type="checkbox" />
                <label for="bf16-gemm" title="By default the matmuls run in INT8/FP8 and adapters fold into the weights (faster, a different but equally good sample)">Exact bf16 matmuls (slower)</label>
              </div>
              <div class="check" id="face-crop-row" hidden>
                <input id="face-crop" type="checkbox" />
                <label for="face-crop" title="Swap on the face region only, pasted back at full resolution">Face crop (fast)</label>
              </div>
              <div class="check" id="full-precision-row" hidden>
                <input id="full-precision" type="checkbox" />
                <label for="full-precision" title="Run the bf16 Z-Image DiT at full precision instead of the default load-time Q8 transcode. Max precision but ~6x slower per step; the default Q8 already matches zimage-turbo-q8 quality.">Full precision (bf16, slow)</label>
              </div>
              <div class="check" id="occlusion-mask-row" hidden>
                <input id="occlusion-mask" type="checkbox" />
                <label for="occlusion-mask" title="Let hands/hair/glasses crossing the face show through instead of swapped pixels (adds one pass per face)">Occlusion mask (XSeg)</label>
              </div>
              <div class="check" id="hyperswap-mask-row" hidden>
                <input id="hyperswap-mask" type="checkbox" checked />
                <label for="hyperswap-mask" title="Tighten the blend to the region HyperSwap actually synthesized (free)">HyperSwap mask</label>
              </div>
              <div class="check" id="enhance-row" hidden>
                <input id="enhance" type="checkbox" />
                <label for="enhance" title="Run the GFPGAN face enhancer on each swapped face (restores skin/eye/teeth detail; adds a pass per face)">Enhance (GFPGAN)</label>
              </div>
            </div>
          </section>

          <!-- Adapter (LoRA) vault. Adapters belong to a model and are encrypted
               at rest; the password unlocks them, rides each request only, and is
               kept in this tab's memory. -->
          <details id="adapters-section" class="group panel" hidden>
            <summary>Adapters (LoRA)</summary>
            <div class="grid">
              <div class="field span-all">
                <label for="vault-password">Password</label>
                <input id="vault-password" form="vault-form" type="password" placeholder="unlocks your adapter vault" autocomplete="off" />
              </div>
              <div class="inline span-all">
                <button id="adapters-refresh" form="vault-form" type="submit" class="secondary">List adapters</button>
                <span id="adapters-status" class="hint"></span>
              </div>
              <!-- One row per stored adapter (checkbox + weight); checked ones are
                   folded into the DiT for this generation, in listed order. -->
              <div id="adapters-list" class="span-all"></div>
              <details id="adapters-add" class="span-all">
                <summary>Add adapter by URL</summary>
                <div class="grid">
                  <div class="field span-all">
                    <label for="adapter-url">URL</label>
                    <input id="adapter-url" form="adapter-add-form" type="url" placeholder="https://civitai.com/api/download/models/…" />
                  </div>
                  <div class="field">
                    <label for="adapter-token">Token</label>
                    <input id="adapter-token" form="adapter-add-form" type="password" placeholder="Civitai token, if needed" autocomplete="off" />
                  </div>
                  <div class="field">
                    <label for="adapter-name">Name</label>
                    <input id="adapter-name" form="adapter-add-form" type="text" placeholder="(download filename)" />
                  </div>
                  <div class="field">
                    <label for="adapter-weight">Default weight</label>
                    <input id="adapter-weight" form="adapter-add-form" type="text" inputmode="decimal" placeholder="1.0" />
                  </div>
                  <div class="inline span-all">
                    <button id="adapter-add-btn" form="adapter-add-form" type="submit" class="secondary">Add to vault</button>
                  </div>
                </div>
              </details>
            </div>
          </details>

          <details class="group panel" id="advanced">
            <summary>Advanced</summary>
            <div class="grid">
              <div class="field" id="attn-window-row" hidden>
                <label for="attn-window">Attention window (frames)</label>
                <input id="attn-window" type="number" min="0" title="Latent-frame radius. Blank = model default (Wan2.2 3, AnyFlow/Hunyuan full). 0 = full attention. On AnyFlow the first denoise step always runs full attention (anchors the scene); the window speeds up the later steps." />
              </div>
            </div>
            <div class="checks">
              <div class="check" id="coopmat-row">
                <input id="coopmat" type="checkbox" checked />
                <label for="coopmat">Tensor-core (coopmat)</label>
              </div>
            </div>
          </details>

          <div class="actions">
            <button id="generate" type="submit" class="primary">Generate</button>
          </div>
        </fieldset>
      </form>

      <section class="card output" aria-live="polite">
        <p id="status">Idle.</p>
        <button id="cancel" type="button" class="danger" hidden>Cancel</button>
        <div class="media">
          <img id="image-out" alt="Generated image" hidden />
          <video id="video-out" controls playsinline hidden></video>
        </div>
        <p><a id="download" class="download" hidden download>Download</a></p>
        <details class="log-panel" open>
          <summary>Log</summary>
          <!-- Progress + errors mirror here, since phones have no dev console. -->
          <textarea id="log" rows="12" readonly></textarea>
        </details>
      </section>
    </main>

    <!-- Owners of the adapter-vault fields above (bound via `form=`): Enter in
         them runs the vault action instead of submitting a generation. -->
    <form id="vault-form" hidden></form>
    <form id="adapter-add-form" hidden></form>
    <script type="module" src="./app.js"></script>
  </body>
</html>
